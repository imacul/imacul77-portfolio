backend:
  name: git-gateway
  branch: main
media_folder: "assets/uploads"
public_folder: "/assets/uploads"
site_url: "/"
display_url: "/"
collections:
  - name: "site"
    label: "Site content"
    files:
      - label: "Portfolio content"
        name: "content"
        file: "content/site.json"
        format: "json"
        fields:
          - { label: "Brand", name: "brand", widget: "string" }
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
          - label: "Entry screen"
            name: "entry"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Emphasis", name: "emphasis", widget: "string" }
              - { label: "Copy", name: "copy", widget: "text" }
              - { label: "Sound button", name: "sound", widget: "string" }
              - { label: "Silent button", name: "silent", widget: "string" }
              - { label: "Footnote", name: "footnote", widget: "string" }
          - label: "About / Index"
            name: "about"
            widget: "object"
            fields:
              - { label: "Kicker", name: "kicker", widget: "string" }
              - { label: "Heading (HTML allowed)", name: "heading", widget: "string" }
              - { label: "Copy", name: "copy", widget: "text" }
              - { label: "Button", name: "button", widget: "string" }
          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - { label: "Kicker", name: "kicker", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Emphasis", name: "emphasis", widget: "string" }
              - { label: "Email label", name: "email", widget: "string" }
              - { label: "Email URL", name: "emailUrl", widget: "string" }
              - { label: "Social label", name: "socialLabel", widget: "string" }
              - { label: "Social URL", name: "socialUrl", widget: "string" }
              - { label: "Copyright", name: "copyright", widget: "string" }
              - { label: "Services", name: "services", widget: "string" }
              - { label: "Back link", name: "back", widget: "string" }
          - label: "Projects"
            name: "projects"
            widget: "list"
            summary: "{{name}} — {{category}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Description", name: "description", widget: "string" }
              - { label: "Category", name: "category", widget: "select", options: [frontend, fullstack, mobile] }
              - { label: "Project URL", name: "href", widget: "string" }
              - { label: "Image", name: "img", widget: "image" }
              - { label: "Fallback color", name: "color", widget: "string", required: false }
